<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1052" viewBox="0 0 1200 1052" role="img" aria-label="Entwicklungsweg von Bastian Scherzinger, 2016 bis 2026">
  <title>Entwicklungsweg von Bastian Scherzinger, 2016 bis 2026</title>
  <defs></defs>
  <style>
    .s { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace; }
    .ring { animation: pulse 3.6s ease-in-out infinite;
             transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .30 }
                        50%     { transform: scale(1.35); opacity: .04 } }
    @media (prefers-reduced-motion: reduce) {
      .ring, .comet { animation: none !important; }
    }

    .comet { animation: travel 7s cubic-bezier(.5,0,.5,1) infinite; }
    @keyframes travel {
      0%   { transform: translateY(0);            opacity: 0 }
      6%   { opacity: 1 }
      88%  { opacity: 1 }
      100% { transform: translateY(852px);   opacity: 0 }
    }
</style>
  <rect x="1" y="1" width="1198" height="1050" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <text class="s" x="44" y="36" font-size="12" fill="#6E7681" letter-spacing="1.4">ENTWICKLUNGSWEG</text>
  <line x1="92" y1="118" x2="92" y2="970" stroke="#21262D" stroke-width="2" stroke-linecap="round"/>
  <line x1="92" y1="118" x2="92" y2="970" stroke="#8A6524" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <circle class="comet" cx="92" cy="118" r="3.5" fill="#FFD9A0"/>
