  <text class="s" x="236" y="303" font-size="13" fill="#8B949E">Erstes eigenes Script auf GitHub — steht bis heute dort</text>
  <circle cx="92" cy="342" r="4.5" fill="#0D1117" stroke="#4A5560" stroke-width="2.2"/>
