  <text class="m" x="124" y="115" font-size="12" fill="#6E7681">2016</text>
  <text class="s" x="236" y="115" font-size="15.5" font-weight="700" fill="#E6EDF3">Scratch</text>
  <text class="s" x="236" y="135" font-size="13" fill="#8B949E">Mit 11 die ersten Blöcke zusammengesteckt</text>
  <circle cx="92" cy="174" r="4.5" fill="#0D1117" stroke="#4A5560" stroke-width="2.2"/>
  <text class="m" x="124" y="171" font-size="12" fill="#6E7681">2017</text>
  <text class="s" x="236" y="171" font-size="15.5" font-weight="700" fill="#E6EDF3">Python</text>
  <text class="s" x="236" y="191" font-size="13" fill="#8B949E">Mit 12 der Einstieg — eingeführt vom Vater</text>
