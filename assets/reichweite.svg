<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Reichweite auf TikTok">
  <title>Reichweite auf TikTok</title>
  <defs>
    <radialGradient id="rglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8A33D" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#E8A33D" stop-opacity="0"/>
    </radialGradient></defs>
  <style>
    .s { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace; }
    .ring { animation: pulse 3.6s ease-in-out infinite;
             transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .30 }
                        50%     { transform: scale(1.35); opacity: .04 } }
    @media (prefers-reduced-motion: reduce) {
      .ring, .comet { animation: none !important; }
    }

    .puls { animation: p 4s ease-in-out infinite; transform-origin: 1030px 125px; }
    @keyframes p { 0%,100% { transform: scale(1); opacity:.85 } 50% { transform: scale(1.08); opacity:1 } }
    @media (prefers-reduced-motion: reduce) { .puls { animation: none } }
</style>
  <rect x="1" y="1" width="1198" height="248" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <clipPath id="rc"><rect x="1" y="1" width="1198" height="248" rx="14"/></clipPath>
  <g clip-path="url(#rc)"><circle class="puls" cx="1030" cy="125" r="200" fill="url(#rglow)"/></g>
  <text class="s" x="44" y="46" font-size="12" fill="#6E7681" letter-spacing="1.4">REICHWEITE</text>
  <text class="m" x="44" y="78" font-size="20" font-weight="600" fill="#E8A33D">@python_tutorials_de</text>
  <text class="s" x="44" y="104" font-size="13.5" fill="#8B949E">Python-Tutorials und Projektbeispiele auf TikTok — mehrere Kunden kamen über diesen Kanal.</text>
  <line x1="44" y1="128" x2="1156" y2="128" stroke="#21262D" stroke-width="1"/>
  <text class="m" x="44" y="185" font-size="34" font-weight="700" fill="#E6EDF3" letter-spacing="-1">1.800+</text>
  <text class="s" x="44" y="207" font-size="11.5" fill="#E8A33D" letter-spacing="0.9">FOLLOWER</text>
  <text class="s" x="44" y="227" font-size="12" fill="#6E7681">von null aufgebaut</text>
  <text class="m" x="322" y="185" font-size="34" font-weight="700" fill="#E6EDF3" letter-spacing="-1">11.269</text>
  <text class="s" x="322" y="207" font-size="11.5" fill="#E8A33D" letter-spacing="0.9">LIKES</text>
  <text class="s" x="322" y="227" font-size="12" fill="#6E7681">über alle Videos</text>
  <text class="m" x="600" y="185" font-size="34" font-weight="700" fill="#E6EDF3" letter-spacing="-1">126.000</text>
  <text class="s" x="600" y="207" font-size="11.5" fill="#E8A33D" letter-spacing="0.9">AUFRUFE</text>
  <text class="s" x="600" y="227" font-size="12" fill="#6E7681">bestes Video</text>
  <text class="m" x="878" y="185" font-size="34" font-weight="700" fill="#E6EDF3" letter-spacing="-1">100.000</text>
  <text class="s" x="878" y="207" font-size="11.5" fill="#E8A33D" letter-spacing="0.9">AUFRUFE</text>
  <text class="s" x="878" y="227" font-size="12" fill="#6E7681">zweitbestes Video</text>
</svg>
