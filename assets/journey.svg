  <text class="s" x="236" y="875" font-size="13" fill="#8B949E">Eigene KI-Agenten-Plattform — 44.285 Zeilen, 258 Commits</text>
  <circle class="ring" cx="92" cy="914" r="12" fill="none" stroke="#E8A33D" stroke-width="1.2" opacity="0.30"/>
  <circle cx="92" cy="914" r="6.5" fill="#E8A33D" stroke="#E8A33D" stroke-width="2.2"/>
  <text class="m" x="124" y="911" font-size="12" fill="#E8A33D">Jul 2026</text>
  <text class="s" x="236" y="911" font-size="15.5" font-weight="700" fill="#E6EDF3">livingen</text>
  <text class="s" x="236" y="931" font-size="13" fill="#8B949E">47.785 Zeilen, 1.545 Tests, Docker, GitHub Actions</text>
  <circle class="ring" cx="92" cy="970" r="12" fill="none" stroke="#E8A33D" stroke-width="1.2" opacity="0.30"/>
  <circle cx="92" cy="970" r="6.5" fill="#E8A33D" stroke="#E8A33D" stroke-width="2.2"/>
  <text class="m" x="124" y="967" font-size="12" fill="#E8A33D">Aug 2026</text>
  <text class="s" x="236" y="967" font-size="15.5" font-weight="700" fill="#E6EDF3">LieferungDirekt</text>
