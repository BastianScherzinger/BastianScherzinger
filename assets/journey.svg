  <circle cx="92" cy="460" r="6.5" fill="#E8A33D" stroke="#E8A33D" stroke-width="2.2"/>
  <text class="m" x="124" y="457" font-size="12" fill="#E8A33D">Jul 2025</text>
  <text class="s" x="236" y="457" font-size="15.5" font-weight="700" fill="#E6EDF3">Realschulabschluss</text>
  <text class="s" x="236" y="477" font-size="13" fill="#8B949E">TikTok @python_tutorials_de startet — Lehren als Lernmethode</text>
  <circle cx="92" cy="516" r="4.5" fill="#0D1117" stroke="#4A5560" stroke-width="2.2"/>
  <text class="m" x="124" y="513" font-size="12" fill="#6E7681">Dez 2025</text>
  <text class="s" x="236" y="513" font-size="15.5" font-weight="700" fill="#E6EDF3">Wieder bei null</text>
  <text class="s" x="236" y="533" font-size="13" fill="#8B949E">hello world, turtle-Grafik, ursina — bewusst von vorn</text>
  <circle cx="92" cy="572" r="4.5" fill="#0D1117" stroke="#4A5560" stroke-width="2.2"/>
  <text class="m" x="124" y="569" font-size="12" fill="#6E7681">Jan–Feb 2026</text>
  <text class="s" x="236" y="569" font-size="15.5" font-weight="700" fill="#E6EDF3">Grundlagen</text>
  <text class="s" x="236" y="589" font-size="13" fill="#8B949E">Scraper, Flask, REST-APIs, OpenCV</text>
  <circle class="ring" cx="92" cy="628" r="12" fill="none" stroke="#E8A33D" stroke-width="1.2" opacity="0.30"/>
  <circle cx="92" cy="628" r="6.5" fill="#E8A33D" stroke="#E8A33D" stroke-width="2.2"/>
  <text class="m" x="124" y="625" font-size="12" fill="#E8A33D">Mär 2026</text>
  <text class="s" x="236" y="625" font-size="15.5" font-weight="700" fill="#E6EDF3">VintedBot</text>
  <text class="s" x="236" y="645" font-size="13" fill="#8B949E">Erster bezahlter Auftrag — über einen TikTok-Kommentar</text>
  <text class="s" x="44" y="680" font-size="11.5" font-weight="700" fill="#6E7681" letter-spacing="1.6">2026   ·   PROFESSIONELL</text>
