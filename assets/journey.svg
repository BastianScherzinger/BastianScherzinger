  <text class="s" x="236" y="763" font-size="13" fill="#8B949E">async, MongoDB, Proxy-Routing, Dashboard — in 23 Tagen</text>
  <circle cx="92" cy="802" r="4.5" fill="#0D1117" stroke="#4A5560" stroke-width="2.2"/>
  <text class="m" x="124" y="799" font-size="12" fill="#6E7681">Mai 2026</text>
  <text class="s" x="236" y="799" font-size="15.5" font-weight="700" fill="#E6EDF3">Django</text>
  <text class="s" x="236" y="819" font-size="13" fill="#8B949E">Erste Kundenseiten gehen live</text>
  <circle class="ring" cx="92" cy="858" r="12" fill="none" stroke="#E8A33D" stroke-width="1.2" opacity="0.30"/>
  <circle cx="92" cy="858" r="6.5" fill="#E8A33D" stroke="#E8A33D" stroke-width="2.2"/>
  <text class="m" x="124" y="855" font-size="12" fill="#E8A33D">Jun 2026</text>
