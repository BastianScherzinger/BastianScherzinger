<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Bastian Scherzinger — Full-Stack Developer, Python und Django">
  <title>Bastian Scherzinger — Full-Stack Developer · Python &amp; Django</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8A33D" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#E8A33D" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#E8A33D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8A33D"/>
      <stop offset="100%" stop-color="#E8A33D" stop-opacity="0.12"/>
    </linearGradient>
    <!-- wandernder Lichtreflex auf der Akzentlinie -->
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="120" y2="0">
      <stop offset="0%" stop-color="#FFD9A0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFD9A0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFD9A0" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-140 0; 360 0; 360 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="298" rx="14"/></clipPath>
    <clipPath id="ruleClip"><rect x="44" y="136" width="300" height="8" rx="4"/></clipPath>
  </defs>

  <style>
    .s { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace; }
    .caret { animation: blink 1.15s steps(1) infinite; }
    @keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }
    .orb { animation: drift 11s ease-in-out infinite; transform-origin: 1020px 150px; }
    @keyframes drift { 0%,100% { transform: scale(1); opacity: .9 } 50% { transform: scale(1.09); opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .caret, .orb { animation: none } }
  </style>

  <rect x="1" y="1" width="1198" height="298" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <g clip-path="url(#card)">
    <circle class="orb" cx="1020" cy="150" r="250" fill="url(#glow)"/>
  </g>

  <!-- Pfadzeile -->
  <text class="m" x="44" y="58" font-size="13" fill="#6E7681">~/bastian-scherzinger</text>
  <rect class="caret" x="217" y="47" width="8" height="15" rx="1" fill="#E8A33D"/>

  <!-- Name + Akzentlinie mit Lichtreflex -->
  <text class="s" x="44" y="122" font-size="46" font-weight="700" fill="#E6EDF3" letter-spacing="-1.2">Bastian Scherzinger</text>
  <rect x="44" y="138" width="300" height="3" rx="1.5" fill="url(#rule)"/>
  <g clip-path="url(#ruleClip)">
    <rect x="44" y="138" width="300" height="3" rx="1.5" fill="url(#sheen)"/>
  </g>

  <!-- Rolle -->
  <text class="s" x="44" y="178" font-size="19" font-weight="600" fill="#E8A33D">Full-Stack Developer — Python · Django · FastAPI</text>

  <!-- Meta -->
  <text class="s" x="44" y="212" font-size="14" fill="#8B949E">21 Jahre · Deutschland · angehender Fachinformatiker Anwendungsentwicklung</text>
  <text class="s" x="44" y="236" font-size="14" fill="#8B949E">Seit Juli 2025 durchgehend im Code — sechs Kundenseiten und zwei eigene Produkte live</text>

  <!-- Kennzahlen -->
  <g class="m">
    <text x="820" y="98" font-size="25" font-weight="700" fill="#E6EDF3">170.668</text>
    <text class="s" x="820" y="117" font-size="11.5" fill="#7D8590" letter-spacing="0.6">ZEILEN PYTHON</text>
    <text x="1020" y="98" font-size="25" font-weight="700" fill="#E6EDF3">2.324</text>
    <text class="s" x="1020" y="117" font-size="11.5" fill="#7D8590" letter-spacing="0.6">TESTFUNKTIONEN</text>
    <text x="820" y="182" font-size="25" font-weight="700" fill="#E6EDF3">8</text>
    <text class="s" x="820" y="201" font-size="11.5" fill="#7D8590" letter-spacing="0.6">SEITEN LIVE</text>
    <text x="1020" y="182" font-size="25" font-weight="700" fill="#E6EDF3">15</text>
    <text class="s" x="1020" y="201" font-size="11.5" fill="#7D8590" letter-spacing="0.6">KERNPROJEKTE</text>
  </g>
  <line x1="820" y1="140" x2="1156" y2="140" stroke="#21262D" stroke-width="1"/>
</svg>
