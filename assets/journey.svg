  <text class="s" x="236" y="227" font-size="15.5" font-weight="700" fill="#E6EDF3">Programmier-AG</text>
  <text class="s" x="236" y="247" font-size="13" fill="#8B949E">Im Internat 10–15 Schülern Python beigebracht</text>
